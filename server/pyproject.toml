[project]
name = "agentforge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "events", "harness", "manifests", "models", "state"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphs*", "nodes*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "*.egg-info"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# stdlib → 서드파티 → 로컬. 로컬 모듈을 first-party로 인식시킨다.
known-first-party = ["config", "events", "harness", "manifests", "models", "state", "graphs", "nodes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

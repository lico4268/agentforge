# Agentforge 설정 파일
# API 키는 여기에 넣지 않는다 — server/.env 에서 관리.

# ── 서버 ────────────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 8000
  log_level: info
  cors_origins:
    - "http://localhost:5173"

# ── 모델 목록 ────────────────────────────────────────────────────────────────────
# enabled: false 로 비활성화. temperature / max_tokens 는 노드 기본값으로 사용.
models:
  default: claude-sonnet-4-6
  list:
    - id: claude-haiku-4-5-20251001
      provider: anthropic
      label: "Claude Haiku 4.5"
      description: "빠르고 저렴한 Anthropic 모델"
      enabled: true
      temperature: 0.0
      max_tokens: 4096

    - id: claude-sonnet-4-6
      provider: anthropic
      label: "Claude Sonnet 4.6"
      description: "균형 잡힌 Anthropic 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: claude-opus-4-8
      provider: anthropic
      label: "Claude Opus 4.8"
      description: "Anthropic 고성능 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: claude-fable-5
      provider: anthropic
      label: "Claude Fable 5"
      description: "Anthropic 최신 플래그십 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.5-flash
      provider: google
      label: "Gemini 3.5 Flash"
      description: "Google 최신 플래그십 Flash — 에이전트/코딩 특화"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.1-pro-preview
      provider: google
      label: "Gemini 3.1 Pro (Preview)"
      description: "Google 최고성능 Pro 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.1-flash-lite
      provider: google
      label: "Gemini 3.1 Flash Lite"
      description: "Google 경량 Flash 모델 — 저비용 고속"
      enabled: true
      temperature: 0.0
      max_tokens: 4096

    - id: gemini-2.5-flash
      provider: google
      label: "Gemini 2.5 Flash"
      description: "Google 이전 세대 Flash (안정적)"
      enabled: false
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-2.5-pro
      provider: google
      label: "Gemini 2.5 Pro"
      description: "Google 이전 세대 Pro (안정적)"
      enabled: false
      temperature: 0.7
      max_tokens: 8192

    - id: gpt-4o-mini
      provider: openai
      label: "GPT-4o Mini"
      description: "빠르고 저렴한 OpenAI 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 4096

    - id: gpt-4o
      provider: openai
      label: "GPT-4o"
      description: "OpenAI 플래그십 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: local-model
      provider: local
      label: "Local (Ollama)"
      description: "local.base_url 로 설정된 로컬 모델"
      enabled: true
      temperature: 0.7
      max_tokens: 4096

# ── 로컬 모델 엔드포인트 ─────────────────────────────────────────────────────────
local:
  base_url: "http://localhost:11434/v1"

# ── 실행 엔진 ────────────────────────────────────────────────────────────────────
execution:
  max_retries: 2
  node_timeout: 120        # 노드 하나당 최대 실행 시간 (초)
  pass_threshold: 0.85     # 이상이면 자동 통과
  auto_threshold: 0.6      # 이상이면 자동 처리, 미만이면 human review
  escalate_tags:           # 이 태그가 있으면 무조건 human review
    - high-stakes
    - medical
    - legal

# ── UI 기본값 ────────────────────────────────────────────────────────────────────
ui:
  theme: dark
  canvas:
    snap_to_grid: true
    grid_size: 20

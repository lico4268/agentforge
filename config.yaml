# Agentforge config file
# API keys do not go here — they are managed in server/.env.

# ── Server ──────────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 8000
  log_level: info
  cors_origins:
    - "http://localhost:5137"
    - "http://127.0.0.1:5137"

# ── Model list ──────────────────────────────────────────────────────────────────
# Disable with enabled: false. temperature / max_tokens are used as node defaults.
models:
  default: gemini-3.1-flash-lite
  list:
    - id: claude-haiku-4-5-20251001
      provider: anthropic
      label: "Claude Haiku 4.5"
      description: "Fast, low-cost Anthropic model"
      enabled: true
      temperature: 0.0
      max_tokens: 4096

    - id: claude-sonnet-4-6
      provider: anthropic
      label: "Claude Sonnet 4.6"
      description: "Balanced Anthropic model"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: claude-opus-4-8
      provider: anthropic
      label: "Claude Opus 4.8"
      description: "High-performance Anthropic model"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: claude-fable-5
      provider: anthropic
      label: "Claude Fable 5"
      description: "Latest flagship Anthropic model"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.5-flash
      provider: google
      label: "Gemini 3.5 Flash"
      description: "Latest flagship Google Flash — specialized for agents/coding"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.1-pro-preview
      provider: google
      label: "Gemini 3.1 Pro (Preview)"
      description: "Top-performance Google Pro model"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-3.1-flash-lite
      provider: google
      label: "Gemini 3.1 Flash Lite"
      description: "Lightweight Google Flash model — low cost, high speed"
      enabled: true
      temperature: 0.0
      max_tokens: 4096

    - id: gemini-2.5-flash
      provider: google
      label: "Gemini 2.5 Flash"
      description: "Previous-generation Google Flash (stable)"
      enabled: false
      temperature: 0.7
      max_tokens: 8192

    - id: gemini-2.5-pro
      provider: google
      label: "Gemini 2.5 Pro"
      description: "Previous-generation Google Pro (stable)"
      enabled: false
      temperature: 0.7
      max_tokens: 8192

    - id: gpt-4o-mini
      provider: openai
      label: "GPT-4o Mini"
      description: "Fast, low-cost OpenAI model"
      enabled: true
      temperature: 0.7
      max_tokens: 4096

    - id: gpt-4o
      provider: openai
      label: "GPT-4o"
      description: "OpenAI flagship model"
      enabled: true
      temperature: 0.7
      max_tokens: 8192

    - id: local-model
      provider: local
      label: "Local (Ollama)"
      description: "Local model configured via local.base_url"
      enabled: true
      temperature: 0.7
      max_tokens: 4096

    # OpenRouter models are not listed here — the catalog has hundreds, so pick them in the favorites screen
    # and save to server/openrouter_favorites.json; /api/models layers only those on dynamically.

  # Model prices (USD / 1M tokens). Used to compute cost in token_usage events.
  # Note: includes estimates — may differ from actual billing rates, so update from the official price list.
  #   Models not listed here are tallied with cost=0 (token counts are always recorded).
  pricing:
    gemini-3.5-flash: { input: 0.30, output: 2.50 }
    gemini-3.1-flash-lite: { input: 0.10, output: 0.40 }
    gemini-3.1-pro-preview: { input: 1.25, output: 10.00 }
    claude-haiku-4-5-20251001: { input: 1.00, output: 5.00 }
    claude-sonnet-4-6: { input: 3.00, output: 15.00 }
    gpt-4o-mini: { input: 0.15, output: 0.60 }
    local-model: { input: 0.0, output: 0.0 }

# ── Local model endpoint ────────────────────────────────────────────────────────
local:
  base_url: "http://localhost:11434/v1"

# ── Execution engine ────────────────────────────────────────────────────────────
execution:
  max_retries: 2
  node_timeout: 120        # max run time per node (seconds)
  llm_retry_count: 1       # extra retries on LLM call failure (timeout/transient error/output validation)
  escalate_tags:           # if present, auto-accept is forbidden → clarify
    - high-stakes
    - medical
    - legal

# ── UI defaults ─────────────────────────────────────────────────────────────────
ui:
  theme: dark
  canvas:
    snap_to_grid: true
    grid_size: 20
